<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semáforo de Ruído</title>
  <style>
    /* Reset básico e centralização */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #0d0f12;
      color: #ffffff;
    }

    h1 {
      margin-bottom: 25px;
      font-size: 2rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #e0e0e0;
    }

    /* Corpo do Semáforo */
    .semaforo {
      background: linear-gradient(145deg, #23272a, #141619);
      padding: 25px;
      border-radius: 40px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8),
                  inset 0 1px 1px rgba(255, 255, 255, 0.1);
      border: 3px solid #2c3036;
    }

    /* Base individual das Luzes */
    .luz {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background-color: #000000;
      opacity: 0.25;
      transition: opacity 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease;
      border: 2px solid rgba(0, 0, 0, 0.6);
      position: relative;
    }

    /* Efeito de reflexo de vidro nas luzes */
    .luz::after {
      content: '';
      position: absolute;
      top: 8%;
      left: 15%;
      width: 70%;
      height: 35%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.3), transparent);
      border-radius: 50% 50% 0 0;
      pointer-events: none;
    }

    /* Cores base */
    .vermelho { background-color: #ff3b30; }
    .amarelo  { background-color: #ffcc00; }
    .verde    { background-color: #34c759; }

    /* Luzes Ativas (Acesas) */
    .vermelho.ativo {
      opacity: 1;
      transform: scale(1.03);
      box-shadow: 0 0 25px #ff3b30, 0 0 50px rgba(255, 59, 48, 0.6);
    }

    .amarelo.ativo {
      opacity: 1;
      transform: scale(1.03);
      box-shadow: 0 0 25px #ffcc00, 0 0 50px rgba(255, 204, 0, 0.6);
    }

    .verde.ativo {
      opacity: 1;
      transform: scale(1.03);
      box-shadow: 0 0 25px #34c759, 0 0 50px rgba(52, 199, 89, 0.6);
    }

    /* Botão de Iniciar */
    button {
      margin-top: 30px;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, #007aff, #0056b3);
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 122, 255, 0.6);
    }

    button:active {
      transform: translateY(0);
    }

    /* Texto de Status */
    .status {
      margin-top: 20px;
      font-size: 1.1rem;
      font-weight: 500;
      color: #a0a5b0;
    }
  </style>
</head>
<body>

  <h1>Semáforo de Ruído</h1>

  <div class="semaforo">
    <div id="luzVermelha" class="luz vermelho"></div>
    <div id="luzAmarela" class="luz amarelo"></div>
    <div id="luzVerde" class="luz verde"></div>
  </div>

  <button id="btnIniciar">Iniciar Microfone</button>
  <div id="statusText" class="status">Clique no botão para começar</div>

  <script>
    const luzVermelha = document.getElementById('luzVermelha');
    const luzAmarela = document.getElementById('luzAmarela');
    const luzVerde = document.getElementById('luzVerde');
    const btnIniciar = document.getElementById('btnIniciar');
    const statusText = document.getElementById('statusText');

    let audioContext;
    let analyser;
    let microphone;
    let isListening = false;

    btnIniciar.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });

        audioContext = new (window.AudioContext || window.webkitAudioContext)();

        if (audioContext.state === 'suspended') {
          await audioContext.resume();
        }

        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;

        microphone = audioContext.createMediaStreamSource(stream);
        microphone.connect(analyser);

        btnIniciar.style.display = 'none';
        statusText.innerText = 'Medindo ruído...';
        isListening = true;

        medirAudio();

      } catch (err) {
        alert('Permissão de microfone negada ou não suportada.');
        console.error('Erro ao acessar o microfone:', err);
      }
    });

    function medirAudio() {
      if (!isListening) return;

      const dataArray = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(dataArray);

      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) {
        sum += dataArray[i];
      }
      const volume = sum / dataArray.length;

      atualizarSemaforo(volume);

      requestAnimationFrame(medirAudio);
    }

    function atualizarSemaforo(volume) {
      luzVermelha.classList.remove('ativo');
      luzAmarela.classList.remove('ativo');
      luzVerde.classList.remove('ativo');

      if (volume < 15) {
        luzVerde.classList.add('ativo');
        statusText.innerText = 'Ambiente Silencioso (Verde)';
      } else if (volume >= 15 && volume < 35) {
        luzAmarela.classList.add('ativo');
        statusText.innerText = 'Ruído Moderado (Amarelo)';
      } else {
        luzVermelha.classList.add('ativo');
        statusText.innerText = 'Muito Barulho! (Vermelho)';
      }
    }
  </script>
</body>
</html>
